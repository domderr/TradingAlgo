# Configurazione build GitHub Pages.
#
# Il backend (metodologia, pipeline, generatore) vive nel repository privato
# TradingAlgo-mosaic e non e' piu' presente qui. Le esclusioni sotto restano
# come seconda barriera: se un file del backend ricomparisse per errore in
# questo albero, non verrebbe comunque pubblicato su tradingalgo.it.
#
# NON aggiungere qui `reports_html/`: quella cartella deve restare pubblicata
# perche' e' cio' che l'area riservata mostra agli abbonati. La sua protezione
# richiede un host con autenticazione lato server (vedi SECURITY_REMEDIATION.md).

exclude:
  # Default Jekyll: vanno ripetuti, perche' `exclude` sostituisce la lista di default.
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

  # Backend: non deve mai essere pubblicato, nemmeno se ricompare per sbaglio.
  - mosaic_dev/
  - tools/
  - scripts/
  - admin-rebalance-tool.html
  - DJ_complete.csv
  - DJ_components_asof.csv
  - reports/reports_index.csv

  # Documentazione interna.
  - README.md
  - ACCESS_ANALYTICS.md
  - SECURITY_REMEDIATION.md

  # Pattern di sicurezza: questi tipi di file non vanno mai pubblicati.
  # I glob non attraversano le sottocartelle, quindi i percorsi che contano
  # sono comunque elencati per esteso qui sopra.
  - "*.py"
  - "*.ipynb"
  - "*.xlsx"
  - "*.xlsm"

# File che il sito carica a runtime e che devono restare pubblicati:
#   haircuts.csv                        (reserved-area.html)
#   reports/latest_prices.json          (reserved-area.html)
#   reports/positions.json              (reserved-area.html)
#   reports/reports_index.json          (reserved-area.html)
#   reports/market_scatter_history.json (explore-markets.html)
#   assets/subscriptions.json           (reserved-area.html)
include:
  - haircuts.csv
